<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mod Wiki</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Roboto,sans-serif;background:#121417;color:#e6e8ec;height:100vh;display:flex;overflow:hidden}
#sidebar{width:260px;background:#1a1d22;border-right:1px solid #2c2f36;overflow:auto;padding:12px}
#sidebar a{display:block;padding:7px 9px;margin:3px 0;border-radius:4px;color:#b8c2d0;text-decoration:none}
#sidebar a:hover{background:#272c33;color:#ffbc66}
#main{flex:1;overflow:auto;padding:24px}
#preview{max-width:880px;margin:0 auto}
#preview h1{font-size:28px;margin:12px 0 16px;color:#fff;border-bottom:1px solid #2d3036;padding-bottom:8px}
#preview h2{font-size:22px;margin:18px 0 10px;color:#f0f2f5}
#preview strong{color:#ffbc66}
#preview ul{padding-left:24px;margin:10px 0}
#preview li{margin:6px 0}
#preview a{color:#63b8ff;text-decoration:none}
#preview a:hover{text-decoration:underline}
#preview img{max-width:100%;border-radius:6px;margin:10px 0;background:#252830;padding:4px}
.load{opacity:0.4}
</style>
</head>
<body>
<div id="sidebar">
<div style="margin-bottom:10px;opacity:0.7">文档列表</div>
<div id="fileList">加载目录…</div>
</div>
<div id="main">
<div id="preview">选择左侧文档</div>
</div>

<script>
const previewEl = document.getElementById('preview');
const fileListEl = document.getElementById('fileList');
let docList = [];

function renderMarkdown(text){
    return text
    .replace(/^# (.*?)$/gm,'<h1>$1</h1>')
    .replace(/^## (.*?)$/gm,'<h2>$1</h2>')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/!\[(.*?)\]\((.*?)\)/g,'<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\(\/content\/([^)]+)\)/g,`<a href="javascript:openDoc('$2')">$1</a>`)
    .replace(/^- (.*?)$/gm,'<li>$1</li>')
    .replace(/((?:<li>.*?<\/li>\n?)+)/g,'<ul>$1</ul>')
    .replace(/\n/g,'<br>');
}

async function openDoc(name){
    previewEl.className = "load";
    try{
        const res = await fetch(`/content/${name}.md`);
        if(!res.ok) throw new Error("404");
        const mdText = await res.text();
        previewEl.innerHTML = renderMarkdown(mdText);
    }catch(e){
        previewEl.innerHTML = `<h1>404</h1><p>文档 ${name} 不存在</p>`;
    }
    previewEl.className = "";
}

async function loadIndex(){
    try{
        const resp = await fetch("/content/index.json");
        docList = await resp.json();
        fileListEl.innerHTML = "";
        docList.forEach(name=>{
            const a = document.createElement('a');
            a.textContent = name;
            a.href = `javascript:openDoc('${name}')`;
            fileListEl.appendChild(a);
        });
        readUrlParam();
    }catch(err){
        fileListEl.innerText = "读取目录失败";
    }
}

function readUrlParam(){
    const params = new URLSearchParams(location.search);
    const doc = params.get("doc");
    if(doc) openDoc(doc);
}

loadIndex();
</script>
</body>
</html>
