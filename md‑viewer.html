<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mod Wiki</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Roboto,sans-serif;background:#121417;color:#e6e8ec;height:100vh;overflow:hidden}

#menuBtn{
    position:fixed;
    top:12px;
    left:12px;
    z-index:100;
    width:42px;height:42px;
    background:#23272e;
    border:none;
    color:#fff;
    font-size:22px;
    border-radius:6px;
    cursor:pointer;
}

#sidebar{
    position:fixed;
    top:0;
    left:0;
    width:260px;
    height:100vh;
    background:#1a1d22;
    border-right:1px solid #2c2f36;
    overflow:auto;
    padding:60px 12px 12px;
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    z-index:99;
}
#sidebar.open{
    transform: translateX(0);
}

#sidebar a{
    display:block;
    padding:7px 9px;
    margin:3px 0;
    border-radius:4px;
    color:#b8c2d0;
    text-decoration:none
}
#sidebar a:hover{background:#272c33;color:#ffbc66}

#main{
    height:100vh;
    overflow:auto;
    padding:24px;
}
#preview{max-width:880px;margin:0 auto}

#preview h1{font-size:28px;margin:12px 0 16px;color:#fff;border-bottom:1px solid #2d3036;padding-bottom:8px}
#preview h2{font-size:22px;margin:18px 0 10px;color:#f0f2f5}
#preview strong{color:#ffbc66}
#preview ul{padding-left:24px;margin:10px 0}
#preview li{margin:6px 0}
#preview a{color:#63b8ff;text-decoration:none}
#preview a:hover{text-decoration:underline}
#preview img{max-width:100%;border-radius:6px;margin:10px 0;background:#252830;padding:4px}
.load{opacity:0.4}
</style>
</head>
<body>
<button id="menuBtn">☰</button>

<div id="sidebar">
<div style="margin-bottom:10px;opacity:0.7">文档列表</div>
<div id="fileList">加载目录…</div>
</div>

<div id="main">
<div id="preview">加载中…</div>
</div>

<script>
const previewEl = document.getElementById('preview');
const fileListEl = document.getElementById('fileList');
const sidebar = document.getElementById('sidebar');
const menuBtn = document.getElementById('menuBtn');
let docList = [];

menuBtn.onclick = ()=>{
    sidebar.classList.toggle('open');
};

function renderMarkdown(text){
    return text
    .replace(/^# (.*?)$/gm,'<h1>$1</h1>')
    .replace(/^## (.*?)$/gm,'<h2>$1</h2>')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/!\[(.*?)\]\((.*?)\)/g,'<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\(\/content\/([^)]+)\)/g,`<a href="javascript:openDoc('$2')">$1</a>`)
    .replace(/^- (.*?)$/gm,'<li>$1</li>')
    .replace(/((?:<li>.*?<\/li>\n?)+)/g,'<ul>$1</ul>')
    .replace(/\n/g,'<br>');
}

async function openDoc(name){
    previewEl.className = "load";
    sidebar.classList.remove('open');
    try{
        const res = await fetch(`/content/${name}.md`);
        if(!res.ok) throw new Error("404");
        const mdText = await res.text();
        previewEl.innerHTML = renderMarkdown(mdText);
    }catch(e){
        previewEl.innerHTML = `<h1>404</h1><p>文档 ${name} 不存在</p>`;
    }
    previewEl.className = "";
}

async function loadIndex(){
    try{
        const resp = await fetch("/content/index.json");
        if(!resp.ok){
            throw new Error(`HTTP ${resp.status}`);
        }
        docList = await resp.json();
        fileListEl.innerHTML = "";
        docList.forEach(name=>{
            const a = document.createElement('a');
            a.textContent = name;
            a.href = `javascript:openDoc('${name}')`;
            fileListEl.appendChild(a);
        });

        const params = new URLSearchParams(location.search);
        const doc = params.get("doc");
        if(doc){
            openDoc(doc);
        }else if(docList.length>0){
            // 无url参数，默认打开列表第一项
            openDoc(docList[0]);
        }
    }catch(err){
        fileListEl.innerText = "读取目录失败："+err.message;
        previewEl.innerHTML = "<h2>目录加载失败</h2><p>请检查 /content/index.json 是否存在</p>";
    }
}

loadIndex();
</script>
</body>
</html>
