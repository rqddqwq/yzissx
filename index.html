<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>登陆区块</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#ffffff;
}

.star-bg{
  position:absolute;
  inset:0;
  z-index:1;
  background-image:
    radial-gradient(2px 2px at 20px 30px,rgba(0,0,0,0.08),transparent),
    radial-gradient(1px 1px at 60px 120px,rgba(0,0,0,0.06),transparent),
    radial-gradient(2px 2px at 130px 80px,rgba(0,0,0,0.07),transparent),
    radial-gradient(1px 1px at 180px 190px,rgba(0,0,0,0.05),transparent);
  background-repeat:repeat;
  background-size:220px 220px;
  animation:starMoveUp 22s linear infinite;
}
@keyframes starMoveUp{
  0%{background-position:0 0;}
  100%{background-position:0 -220px;}
}

.core-wrap{
  position:absolute;
  left:50%;
  top:50%;
  width:220px;
  height:220px;
  transform:translate(-50%,-50%);
  z-index:5;
  animation:coreZoomFall 4.2s ease-out forwards;
}

@keyframes coreZoomFall{
  0%{
    transform:translate(-50%,-50%) scale(2.2) rotate(45deg);
    opacity:0.25;
  }
  100%{
    transform:translate(-50%,-50%) scale(1) rotate(0deg);
    opacity:1;
  }
}

.core{
  width:100%;
  height:100%;
  background-image:url("./img.png");
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  filter:drop-shadow(0 0 30px rgba(80,145,255,0.55));
}

.dev-name{
  position:absolute;
  left:50%;
  bottom:calc(100% + 18px);
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:32px;
  color:#2a3a4a;
  letter-spacing:6px;
  text-shadow:0 0 12px rgba(80,145,255,0.35);
  opacity:0;
  animation:nameFadeIn 3s ease-out forwards 4.6s;
}
@keyframes nameFadeIn{
  0%{
    opacity:0;
    transform:translateX(-50%) scale(0.9);
  }
  100%{
    opacity:0.88;
    transform:translateX(-50%) scale(1);
  }
}

.flame{
  position:absolute;
  width:38px;
  height:38px;
  border-radius:50%;
  background:radial-gradient(circle,#ffdd77,#ff8833,transparent);
  opacity:0.85;
  animation:flamePulse 0.45s ease-in-out infinite alternate, flameCut 0s ease forwards 4.2s;
}
@keyframes flameCut{
  to{opacity:0;}
}
@keyframes flamePulse{
  0%{
    scale:0.85;
    filter:blur(4px);
  }
  100%{
    scale:1.15;
    filter:blur(7px);
  }
}

.flame.f1{left:-24px;top:50%;margin-top:-19px;}
.flame.f2{right:-24px;top:50%;margin-top:-19px;}
.flame.f3{top:-24px;left:50%;margin-left:-19px;}
.flame.f4{bottom:-24px;left:50%;margin-left:-19px;}

.yellow-circle{
  position:absolute;
  left:50%;
  top:50%;
  width:0px;
  height:0px;
  transform:translate(-50%,-50%);
  z-index:4;
  border:7px solid rgba(255,200,80,0.9);
  border-radius:50%;
  opacity:0;
  animation:circleSpread 15s ease-out forwards 2.0s;
}

@keyframes circleSpread{
  0%{
    width:0px;
    height:0px;
    opacity:1;
  }
  100%{
    width:1200px;
    height:1200px;
    opacity:0;
  }
}

/* ===== 扩散显示文字区域 start ===== */
.dev-text-wrap{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:4.5;
  width:1400px;
  height:1400px;
  /* 遮罩：和黄色圆环一模一样的动画，圆环到哪文字显示哪 */
  mask-image: radial-gradient(circle, transparent 0%, transparent calc(var(--r) -14px), #fff calc(var(--r) -14px), #fff var(--r), transparent var(--r));
  -webkit-mask-image: radial-gradient(circle, transparent 0%, transparent calc(var(--r) -14px), #fff calc(var(--r) -14px), #fff var(--r), transparent var(--r));
  --r:0px;
  animation:maskAnim 15s ease-out forwards 2.0s;
  pointer-events:none;
}
@keyframes maskAnim {
  0% { --r:0px; }
  100% { --r:600px; }
}

/* 分散四处的多行文本，参差不齐，围绕核心四周 */
.dev-text-item{
  position:absolute;
  color:#664422;
  font-size:18px;
  line-height:1.6;
  white-space:pre-line;
}
/* 左上 */
.tl{
  top:-320px;
  left:-420px;
}
/* 右上 */
.tr{
  top:-280px;
  right:-380px;
}
/* 左下 */
.bl{
  bottom:-340px;
  left:-360px;
}
/* 右下 */
.br{
  bottom:-300px;
  right:-400px;
}
/* ===== 扩散显示文字区域 end ===== */

.btn-container{
  position:absolute;
  left:4vw;
  bottom:12vh;
  z-index:10;
}
.detail-btn{
  padding:14px 32px;
  font-size:16px;
  border:1px solid rgba(90,150,255,0.45);
  border-radius:8px;
  background:rgba(255,255,255,0.85);
  color:#2a3a4a;
  backdrop-filter:blur(8px);
  cursor:pointer;
  transition:0.24s;
  box-shadow:0 4px 18px rgba(0,0,0,0.08);
}
.detail-btn:hover{
  background:rgba(245,250,255,0.95);
  border-color:rgba(80,145,255,0.75);
  transform:translateY(-2px);
}
.detail-btn:active{
  transform:translateY(0);
}

@media(max-width:768px){
  .core-wrap{
    width:170px;
    height:170px;
  }
  .dev-name{
    font-size:24px;
    letter-spacing:3px;
    bottom:calc(100% + 12px);
  }
  .btn-container{
    left:50%;
    transform:translateX(-50%);
  }
  .detail-btn{
    width:280px;
    text-align:center;
  }
}
</style>
</head>
<body>
<div class="star-bg"></div>

<div class="yellow-circle"></div>

<!-- 扩散触发显示的多行开发者文本 -->
<div class="dev-text-wrap">
  <div class="dev-text-item tl">【代码编写】
玄钢重工Mod
版本开发</div>

  <div class="dev-text-item tr">【美术资源】
星球环带
方块贴图</div>

  <div class="dev-text-item bl">【逻辑实现】
市场系统
方块行为</div>

  <div class="dev-text-item br">【测试调试】
安卓端适配
性能优化</div>
</div>

<div class="core-wrap">
  <div class="dev-name">DEVELOPER NAME</div>
  <div class="core"></div>
  <div class="flame f1"></div>
  <div class="flame f2"></div>
  <div class="flame f3"></div>
  <div class="flame f4"></div>
</div>

<div class="btn-container">
  <button class="detail-btn" id="viewBtn">查看详情</button>
</div>

<script>
document.getElementById("viewBtn").onclick = ()=>{
  alert("登陆区块｜查看详情逻辑");
};
</script>
</body>
</html>
