<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>登陆区块</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#ffffff;
}

.star-bg{
  position:absolute;
  inset:0;
  z-index:1;
  background-image:
    radial-gradient(2px 2px at 20px 30px,rgba(0,0,0,0.08),transparent),
    radial-gradient(1px 1px at 60px 120px,rgba(0,0,0,0.06),transparent),
    radial-gradient(2px 2px at 130px 80px,rgba(0,0,0,0.07),transparent),
    radial-gradient(1px 1px at 180px 190px,rgba(0,0,0,0.05),transparent);
  background-repeat:repeat;
  background-size:220px 220px;
  animation:starMoveUp 22s linear infinite;
}
@keyframes starMoveUp{
  0%{background-position:0 0;}
  100%{background-position:0 -220px;}
}

.core-wrap{
  position:absolute;
  left:50%;
  top:0;
  width:220px;
  height:220px;
  transform:translateX(-50%);
  z-index:5;
  animation:coreSlowFall 4.2s ease-out forwards;
}
@keyframes coreSlowFall{
  0%{transform:translateX(-50%) translateY(-180px);opacity:0.2;}
  100%{transform:translateX(-50%) translateY(120px);opacity:1;}
}

/* 读取同目录 img.png 核心贴图 */
.core{
  width:100%;
  height:100%;
  background-image:url("./img.png");
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  filter:drop-shadow(0 0 30px rgba(80,145,255,0.55));
}

.wave-ring-wrap{
  position:absolute;
  left:50%;
  top:calc(50% + 120px);
  transform:translate(-50%,-50%);
  z-index:6;
  pointer-events:none;
  opacity:0;
  animation:waveShow 0s ease forwards 4.4s;
}
.wave-ring{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:20px;
  height:20px;
  border:2px solid rgba(80,145,255,0.55);
  border-radius:50%;
  animation:ringExpand 3.2s ease-out forwards;
}
@keyframes waveShow{
  to{opacity:1;}
}
@keyframes ringExpand{
  0%{width:20px;height:20px;opacity:0.9;}
  100%{width:520px;height:520px;opacity:0;}
}

.dev-name{
  position:absolute;
  left:50%;
  top:calc(50% + 120px);
  transform:translate(-50%,-50%);
  z-index:7;
  pointer-events:none;
  font-size:32px;
  color:#2a3a4a;
  letter-spacing:6px;
  text-shadow:0 0 12px rgba(80,145,255,0.35);
  opacity:0;
  animation:nameFadeIn 3s ease-out forwards 4.8s;
}
@keyframes nameFadeIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.85);}
  100%{opacity:0.88;transform:translate(-50%,-50%) scale(1);}
}

.btn-container{
  position:absolute;
  left:4vw;
  bottom:12vh;
  z-index:10;
}
.detail-btn{
  padding:14px 32px;
  font-size:16px;
  border:1px solid rgba(90,150,255,0.45);
  border-radius:8px;
  background:rgba(255,255,255,0.85);
  color:#2a3a4a;
  backdrop-filter:blur(8px);
  cursor:pointer;
  transition:0.24s;
  box-shadow:0 4px 18px rgba(0,0,0,0.08);
}
.detail-btn:hover{
  background:rgba(245,250,255,0.95);
  border-color:rgba(80,145,255,0.75);
  transform:translateY(-2px);
}
.detail-btn:active{
  transform:translateY(0);
}

@media(max-width:768px){
  .core-wrap{
    width:170px;
    height:170px;
  }
  .dev-name{
    font-size:24px;
    letter-spacing:3px;
  }
  .btn-container{
    left:50%;
    transform:translateX(-50%);
  }
  .detail-btn{
    width:280px;
    text-align:center;
  }
}
</style>
</head>
<body>
<div class="star-bg"></div>

<div class="core-wrap">
  <div class="core"></div>
</div>

<div class="wave-ring-wrap">
  <div class="wave-ring"></div>
</div>

<div class="dev-name">DEVELOPER NAME</div>

<div class="btn-container">
  <button class="detail-btn" id="viewBtn">查看详情</button>
</div>

<script>
document.getElementById("viewBtn").onclick = ()=>{
  alert("登陆区块｜查看详情逻辑");
};
</script>
</body>
</html>
