<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>登陆区块</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#cccccc;
}

.star-bg{
  position:absolute;
  inset:0;
  z-index:1;
  background-image:
    radial-gradient(2px 2px at 20px 30px,rgba(0,0,0,0.08),transparent),
    radial-gradient(1px 1px at 60px 120px,rgba(0,0,0,0.06),transparent),
    radial-gradient(2px 2px at 130px 80px,rgba(0,0,0,0.07),transparent),
    radial-gradient(1px 1px at 180px 190px,rgba(0,0,0,0.05),transparent);
  background-repeat:repeat;
  background-size:220px 220px;
  animation:starMoveUp 22s linear infinite;
}
@keyframes starMoveUp{
  0%{background-position:0 0;}
  100%{background-position:0 -220px;}
}

.core-wrap{
  position:absolute;
  left:50%;
  top:50%;
  width:220px;
  height:220px;
  transform:translate(-50%,-50%);
  z-index:5;
  animation:coreZoomFall 4.2s ease-out forwards;
}

@keyframes coreZoomFall{
  0%{
    transform:translate(-50%,-50%) scale(2.2) rotate(45deg);
    opacity:0.25;
  }
  100%{
    transform:translate(-50%,-50%) scale(1) rotate(0deg);
    opacity:1;
  }
}

.core{
  width:100%;
  height:100%;
  background-image:url("./img.png");
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  filter:drop-shadow(0 0 30px rgba(80,145,255,0.55));
}

.dev-name{
  position:absolute;
  left:50%;
  bottom:calc(100% + 18px);
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:32px;
  color:#2a3a4a;
  letter-spacing:6px;
  text-shadow:0 0 12px rgba(80,145,255,0.35);
  opacity:0;
  animation:nameFadeIn 3s ease-out forwards 4.6s;
}
@keyframes nameFadeIn{
  0%{opacity:0;transform:translateX(-50%) scale(0.9);}
  100%{opacity:0.88;transform:translateX(-50%) scale(1);}
}

.flame{
  position:absolute;
  width:38px;
  height:38px;
  border-radius:50%;
  background:radial-gradient(circle,#ffdd77,#ff8833,transparent);
  opacity:0.85;
  animation:flamePulse 0.45s ease-in-out infinite alternate, flameCut 0s ease forwards 4.2s;
}
@keyframes flameCut{to{opacity:0;}}
@keyframes flamePulse{
  0%{scale:0.85;filter:blur(4px);}
  100%{scale:1.15;filter:blur(7px);}
}
.flame.f1{left:-24px;top:50%;margin-top:-19px;}
.flame.f2{right:-24px;top:50%;margin-top:-19px;}
.flame.f3{top:-24px;left:50%;margin-left:-19px;}
.flame.f4{bottom:-24px;left:50%;margin-left:-19px;}

.yellow-circle{
  position:absolute;
  left:50%;
  top:50%;
  width:0px;
  height:0px;
  transform:translate(-50%,-50%);
  z-index:4;
  border:12px solid rgba(255,180,0,0.95);
  border-radius:50%;
  opacity:0;
  animation:circleSpread 12s ease-out forwards 2.0s;
}
@keyframes circleSpread{
  0%{width:0;height:0;opacity:1;}
  100%{width:800px;height:800px;opacity:0;}
}

.dev-text-item{
  position:absolute;
  color:#664422;
  font-size:16px;
  line-height:1.5;
  white-space:pre-line;
  z-index:4.5;
  pointer-events:none;
  opacity:0;
  animation:textFade 1.0s ease-out forwards;
}
@keyframes textFade{
  0%{opacity:0;}
  100%{opacity:1;}
}

.tl{
  top:-140px;
  left:-130px;
  animation-delay:9.0s;
}
.tr{
  top:-140px;
  left:230px;
  animation-delay:8.8s;
}
.bl{
  top:240px;
  left:-130px;
  animation-delay:8.4s;
}

/* 烟雾：24个小球，存活4秒，核心下方图层，中心留空，环绕旁边生成 */
.smoke-wrap{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:460px;
  height:360px;
  pointer-events:none;
  z-index:4;
}
.smoke-ball{
  position:absolute;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.45) 50%, transparent 72%);
  filter:blur(22px);
  opacity:0;
  animation:smokeRingFromBelow 4s ease-out forwards 2.2s;
}

.smoke-ball:nth-child(1){width:110px;height:110px;left:32%;top:62%;}
.smoke-ball:nth-child(2){width:124px;height:124px;left:58%;top:58%;animation-delay:2.05s;}
.smoke-ball:nth-child(3){width:116px;height:116px;left:18%;top:52%;animation-delay:2.10s;}
.smoke-ball:nth-child(4){width:132px;height:132px;left:72%;top:48%;animation-delay:2.15s;}
.smoke-ball:nth-child(5){width:106px;height:106px;left:8%;top:68%;animation-delay:2.20s;}
.smoke-ball:nth-child(6){width:98px;height:98px;left:82%;top:62%;animation-delay:2.25s;}
.smoke-ball:nth-child(7){width:102px;height:102px;left:22%;top:78%;animation-delay:2.30s;}
.smoke-ball:nth-child(8){width:92px;height:92px;left:64%;top:72%;animation-delay:2.35s;}
.smoke-ball:nth-child(9){width:120px;height:120px;left:38%;top:84%;animation-delay:2.40s;}
.smoke-ball:nth-child(10){width:104px;height:104px;left:14%;top:42%;animation-delay:2.45s;}
.smoke-ball:nth-child(11){width:108px;height:108px;left:76%;top:38%;animation-delay:2.50s;}
.smoke-ball:nth-child(12){width:88px;height:88px;left:48%;top:88%;animation-delay:2.55s;}
.smoke-ball:nth-child(13){width:96px;height:96px;left:28%;top:44%;animation-delay:2.60s;}
.smoke-ball:nth-child(14){width:114px;height:114px;left:68%;top:76%;animation-delay:2.65s;}
.smoke-ball:nth-child(15){width:100px;height:100px;left:12%;top:80%;animation-delay:2.70s;}
.smoke-ball:nth-child(16){width:126px;height:126px;left:84%;top:50%;animation-delay:2.75s;}
.smoke-ball:nth-child(17){width:94px;height:94px;left:42%;top:50%;animation-delay:2.80s;}
.smoke-ball:nth-child(18){width:118px;height:118px;left:54%;top:82%;animation-delay:2.85s;}
.smoke-ball:nth-child(19){width:103px;height:103px;left:34%;top:74%;animation-delay:2.90s;}
.smoke-ball:nth-child(20){width:90px;height:90px;left:62%;top:42%;animation-delay:2.95s;}
.smoke-ball:nth-child(21){width:112px;height:112px;left:20%;top:64%;animation-delay:3.00s;}
.smoke-ball:nth-child(22){width:107px;height:107px;left:78%;top:70%;animation-delay:3.05s;}
.smoke-ball:nth-child(23){width:97px;height:97px;left:44%;top:68%;animation-delay:3.10s;}
.smoke-ball:nth-child(24){width:111px;height:111px;left:52%;top:46%;animation-delay:3.15s;}

@keyframes smokeRingFromBelow{
  0%{
    opacity:0;
    transform:translateY(50px) scale(0.25);
  }
  25%{
    opacity:0.85;
    transform:translateY(0) scale(1);
  }
  100%{
    opacity:0;
    transform:translateY(-30px) scale(1.5);
  }
}

.btn-container{
  position:absolute;
  left:4vw;
  bottom:12vh;
  z-index:10;
}
.detail-btn{
  padding:14px 32px;
  font-size:16px;
  border:1px solid rgba(90,150,255,0.45);
  border-radius:8px;
  background:rgba(255,255,255,0.85);
  color:#2a3a4a;
  backdrop-filter:blur(8px);
  cursor:pointer;
  transition:0.24s;
  box-shadow:0 4px 18px rgba(0,0,0,0.08);
}
.detail-btn:hover{
  background:rgba(245,250,255,0.95);
  border-color:rgba(80,145,255,0.75);
  transform:translateY(-2px);
}
.detail-btn:active{transform:translateY(0);}

@media(max-width:768px){
  .core-wrap{width:170px;height:170px;}
  .dev-name{font-size:24px;letter-spacing:3px;bottom:calc(100% + 12px);}
  .smoke-wrap{width:340px;height:280px;}

  .smoke-ball:nth-child(1){width:80px;height:80px;}
  .smoke-ball:nth-child(2){width:90px;height:90px;}
  .smoke-ball:nth-child(3){width:84px;height:84px;}
  .smoke-ball:nth-child(4){width:96px;height:96px;}
  .smoke-ball:nth-child(5){width:78px;height:78px;}
  .smoke-ball:nth-child(6){width:72px;height:72px;}
  .smoke-ball:nth-child(7){width:74px;height:74px;}
  .smoke-ball:nth-child(8){width:68px;height:68px;}
  .smoke-ball:nth-child(9){width:88px;height:88px;}
  .smoke-ball:nth-child(10){width:76px;height:76px;}
  .smoke-ball:nth-child(11){width:79px;height:79px;}
  .smoke-ball:nth-child(12){width:64px;height:64px;}
  .smoke-ball:nth-child(13){width:70px;height:70px;}
  .smoke-ball:nth-child(14){width:82px;height:82px;}
  .smoke-ball:nth-child(15){width:73px;height:73px;}
  .smoke-ball:nth-child(16){width:92px;height:92px;}
  .smoke-ball:nth-child(17){width:75px;height:75px;}
  .smoke-ball:nth-child(18){width:86px;height:86px;}
  .smoke-ball:nth-child(19){width:77px;height:77px;}
  .smoke-ball:nth-child(20){width:66px;height:66px;}
  .smoke-ball:nth-child(21){width:81px;height:81px;}
  .smoke-ball:nth-child(22){width:78px;height:78px;}
  .smoke-ball:nth-child(23){width:71px;height:71px;}
  .smoke-ball:nth-child(24){width:83px;height:83px;}

  .btn-container{
    left:4vw;
    transform:none;
  }
  .detail-btn{
    width:auto;
    text-align:left;
  }
}
</style>
</head>
<body>
<div class="star-bg"></div>
<div class="yellow-circle"></div>

<div class="smoke-wrap">
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
  <div class="smoke-ball"></div>
</div>

<div class="core-wrap">
  <div class="dev-name">DARKSTEEL</div>
  <div class="core"></div>
  <div class="flame f1"></div>
  <div class="flame f2"></div>
  <div class="flame f3"></div>
  <div class="flame f4"></div>

  <div class="dev-text-item tl">【作者】
容器</div>
  <div class="dev-text-item tr">【贴图】
秦始皇
容器
红蛋天师
一个屑爬重</div>
  <div class="dev-text-item bl">【逻辑实现】
。(大梦一场) </div>
</div>

<div class="btn-container">
  <button class="detail-btn" id="viewBtn">查看详情</button>
</div>

<script>
document.getElementById("viewBtn").onclick = ()=>{
  alert("登陆区块｜查看详情逻辑");
};
</script>
</body>
</html>
